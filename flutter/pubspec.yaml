name: hallar
description: Búsqueda semántica e híbrida sin internet para apps Flutter. Embeddings en el dispositivo, BM25 e índice HNSW en C++.
version: 0.1.0
repository: https://github.com/KlGamers/hallar
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
