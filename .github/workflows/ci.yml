name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DHALLAR_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_container_overflow=0
      - run: cmake -S . -B build-rel -DHALLAR_TESTS=OFF && cmake --build build-rel -j
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./tools[dev]" && pytest -q tools/tests

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - working-directory: android
        run: ./gradlew --no-daemon :hallar:testDebugUnitTest :hallar:assembleRelease
        env:
          HALLAR_JNI_HOME: ${{ env.JAVA_HOME }}

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cmake -S . -B build-rel -DHALLAR_TESTS=OFF && cmake --build build-rel -j
      - working-directory: flutter
        run: flutter pub get && flutter test
        env:
          HALLAR_LIB: ${{ github.workspace }}/build-rel/libhallar.so
