[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hallar-tools"
version = "0.1.0"
description = "Model converter and test helpers for hallar"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "model2vec>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hallar-convert = "hallar_tools.convert:main"

[tool.hatch.build.targets.wheel]
packages = ["hallar_tools"]
